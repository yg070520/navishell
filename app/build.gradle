plugins {
    id 'com.android.application'
}

def naviVersionCode = (System.getenv('NAVI_VERSION_CODE') ?: '2').toInteger()
def naviKeystorePath = System.getenv('NAVI_KEYSTORE_FILE')

android {
    namespace 'com.example.navishell'
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.example.navishell"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode naviVersionCode
        versionName "1.${naviVersionCode}"
    }

    signingConfigs {
        if (naviKeystorePath) {
            navi {
                storeFile file(naviKeystorePath)
                storePassword System.getenv('NAVI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NAVI_KEY_ALIAS')
                keyPassword System.getenv('NAVI_KEY_PASSWORD')
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            signingConfig null
        }
        release {
            signingConfig null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
