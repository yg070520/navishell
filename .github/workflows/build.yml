name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 7.5

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4.0.4
      with:
        packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

    - name: Decode signing keystore
      env:
        NAVI_KEYSTORE_BASE64: ${{ secrets.NAVI_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$NAVI_KEYSTORE_BASE64" ]; then
          echo "$NAVI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/navishell-release.jks"
        fi

    - name: Build Debug APK
      env:
        NAVI_VERSION_CODE: ${{ github.run_number }}
        NAVI_KEYSTORE_PASSWORD: ${{ secrets.NAVI_KEYSTORE_PASSWORD }}
        NAVI_KEY_ALIAS: ${{ secrets.NAVI_KEY_ALIAS }}
        NAVI_KEY_PASSWORD: ${{ secrets.NAVI_KEY_PASSWORD }}
      run: |
        if [ -s "$RUNNER_TEMP/navishell-release.jks" ]; then
          export NAVI_KEYSTORE_FILE="$RUNNER_TEMP/navishell-release.jks"
        elif [ -n "$NAVI_KEYSTORE_PASSWORD" ]; then
          echo "Signing secrets are configured but the keystore was not decoded" >&2
          exit 1
        else
          echo "No signing keystore configured; debug build will use the debug certificate"
        fi
        gradle assembleDebug

    - name: Re-sign APK with V1 and V2
      env:
        NAVI_KEYSTORE_PASSWORD: ${{ secrets.NAVI_KEYSTORE_PASSWORD }}
        NAVI_KEY_ALIAS: ${{ secrets.NAVI_KEY_ALIAS }}
        NAVI_KEY_PASSWORD: ${{ secrets.NAVI_KEY_PASSWORD }}
      run: |
        APKSIGNER="$ANDROID_HOME/build-tools/33.0.2/apksigner"
        INPUT="app/build/outputs/apk/debug/app-debug.apk"
        OUTPUT="app/build/outputs/apk/debug/app-debug-v1v2.apk"
        if [ -s "$RUNNER_TEMP/navishell-release.jks" ]; then
          cp "$INPUT" "${INPUT%.apk}-unsigned.apk"
          jarsigner \
            -keystore "$RUNNER_TEMP/navishell-release.jks" \
            -storepass:env NAVI_KEYSTORE_PASSWORD \
            -keypass:env NAVI_KEY_PASSWORD \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "${INPUT%.apk}-unsigned.apk" \
            "$NAVI_KEY_ALIAS"
          jarsigner -verify -verbose -certs "${INPUT%.apk}-unsigned.apk" \
            | tee jar-signature-verification.txt
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/navishell-release.jks" \
            --ks-key-alias "$NAVI_KEY_ALIAS" \
            --ks-pass env:NAVI_KEYSTORE_PASSWORD \
            --key-pass env:NAVI_KEY_PASSWORD \
            --min-sdk-version 23 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --in "${INPUT%.apk}-unsigned.apk" \
            --out "$OUTPUT"
        else
          echo "No signing keystore configured" >&2
          exit 1
        fi

    - name: Verify V1 and V2 signatures
      run: |
        APKSIGNER="$ANDROID_HOME/build-tools/33.0.2/apksigner"
        "$APKSIGNER" verify --verbose --print-certs \
          app/build/outputs/apk/debug/app-debug-v1v2.apk | tee signature-verification.txt
        grep -q "Verified using v1 scheme (JAR signing): true" signature-verification.txt
        grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signature-verification.txt

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: navi-shell-debug-apk
        path: |
          app/build/outputs/apk/debug/app-debug-v1v2.apk
          signature-verification.txt
          jar-signature-verification.txt
