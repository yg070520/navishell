name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 7.5

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4.0.4
      with:
        packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

    - name: Build Debug APK
      env:
        NAVI_VERSION_CODE: ${{ github.run_number }}
      run: |
        gradle assembleDebug
        find app/build/outputs/apk/debug -maxdepth 2 -type f -name '*.apk' -print

    - name: Sign APK with V1 and V2
      run: |
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
        BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
        APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
        INPUT_APK="$(find app/build/outputs/apk/debug -name '*.apk' ! -name '*-v1v2.apk' | head -1)"

        keytool -genkeypair \
          -keystore debug-v1v2.keystore \
          -storepass android \
          -keypass android \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 36500 \
          -startdate "2020/01/01 00:00:00" \
          -dname "CN=Android Debug,O=Android,C=US"

        "$APKSIGNER" sign \
          --ks debug-v1v2.keystore \
          --ks-pass pass:android \
          --key-pass pass:android \
          --ks-key-alias androiddebugkey \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled false \
          --out app/build/outputs/apk/debug/app-debug-v1v2.apk \
          "$INPUT_APK"

        "$APKSIGNER" verify --verbose --print-certs \
          app/build/outputs/apk/debug/app-debug-v1v2.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: navi-shell-v1-v2-apk
        path: app/build/outputs/apk/debug/app-debug-v1v2.apk
