name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 7.5

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4.0.4
      with:
        packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

    - name: Decode signing keystore
      env:
        NAVI_KEYSTORE_BASE64: ${{ secrets.NAVI_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$NAVI_KEYSTORE_BASE64" ]; then
          echo "$NAVI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/navishell-release.jks"
        fi

    - name: Build Debug APK
      env:
        NAVI_VERSION_CODE: ${{ github.run_number }}
        NAVI_KEYSTORE_FILE: $RUNNER_TEMP/navishell-release.jks
        NAVI_KEYSTORE_PASSWORD: ${{ secrets.NAVI_KEYSTORE_PASSWORD }}
        NAVI_KEY_ALIAS: ${{ secrets.NAVI_KEY_ALIAS }}
        NAVI_KEY_PASSWORD: ${{ secrets.NAVI_KEY_PASSWORD }}
      run: |
        if [ ! -s "$NAVI_KEYSTORE_FILE" ]; then
          unset NAVI_KEYSTORE_FILE
        fi
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: navi-shell-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
